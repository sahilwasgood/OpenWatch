name: Android AAB

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (r30+ for Slint's Skia prebuilts)
        run: |
          set -euo pipefail
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          test -n "$NDK"
          echo "Installing $NDK"
          yes | sdkmanager --install "$NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build btleplug JNI AAR
        run: |
          set -euo pipefail
          JAVA_DIR=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -path '*/btleplug-0.13.*/src/droidplug/java' | head -1)
          test -n "$JAVA_DIR"
          (cd "$JAVA_DIR" && ./gradlew assembleRelease)
          mkdir -p crates/android/libs
          cp "$JAVA_DIR/build/outputs/aar/droidplug-release.aar" crates/android/libs/

      - name: Build native libraries for all four ABIs
        working-directory: crates/android
        run: |
          set -euo pipefail
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo ndk --target "$target" -o app/src/main/jniLibs build --release -p openwatch-android --lib
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the AAB
        working-directory: crates/android
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: openwatch-aab
          path: crates/android/app/build/outputs/bundle/release/app-release.aab
