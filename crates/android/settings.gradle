pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.7.3'
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // btleplug's JNI support classes, built into libs/droidplug-release.aar.
        flatDir { dirs 'libs' }
    }
}

rootProject.name = 'OpenWatch'
include ':app'
